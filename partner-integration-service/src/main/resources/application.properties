server.port=8090
spring.datasource.url=jdbc:mysql://localhost:13306/partner_db
spring.datasource.username=root
spring.datasource.password=labpassword
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
# Read committed: locking reads lock the matching rows only, not the gaps between them. Under the
# default repeatable read, a claim or relay that stalls holding a range lock blocks other
# instances' inserts into that range (new inbox rows, new permits, completion reports).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=localhost:39092
spring.kafka.consumer.group-id=${PARTNER_GROUP:partner-experiment}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=8
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
app.mode=${PARTNER_MODE:inbox}
app.topic=${PARTNER_TOPIC:partner-order-requests}
app.workers=4
app.seller-concurrency=2
app.retry-budget=2
app.retry-window-ms=1000
app.retry-delay-ms=300
app.backlog-limit=200
app.retained-limit=2000
app.partitions=1
app.replication-factor=1
app.inbox-done-retention-ms=60000
app.inbox-batch-ingest=true
app.shutdown-drain-ms=10000
app.input-budget=200
app.call-timeout-ms=5000
app.breaker.slow-call-ms=300
app.breaker.slow-call-rate-percent=50
app.breaker.failure-rate-percent=50
app.breaker.window-size=5
app.breaker.minimum-calls=3
app.breaker.open-ms=1000
app.partner-url=http://localhost:8099
app.code-version=${CODE_VERSION:unknown}
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
spring.kafka.consumer.properties.interceptor.classes=com.ordersystem.partner.PollTrace
management.endpoints.web.exposure.include=health,prometheus
# Several scheduled tasks (dispatch tick, purge, completion relay, backlog gauges) must not wait on each other.
spring.task.scheduling.pool.size=4
# Completion reports for the source; empty disables them.
app.completion-topic=${PARTNER_COMPLETION_TOPIC:}
