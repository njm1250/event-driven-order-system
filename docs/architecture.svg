<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">판매처 주문 연동 처리 구조</text>
  <text x="24" y="60" font-size="13" fill="#475569">Kafka offset은 "수신함 저장 완료"까지만 의미하고, 판매처별 실행 상한은 워커 입장 단계에서 건다</text>

  <!-- Order service -->
  <rect x="24" y="96" width="190" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="122" font-size="15" font-weight="700" fill="#0f172a">Order Service</text>
  <text x="40" y="146" font-size="12" fill="#334155">생성 · 변경 · 취소 API</text>
  <rect x="40" y="160" width="158" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="182" font-size="12" font-weight="600" fill="#0f172a">order_db</text>
  <text x="52" y="200" font-size="11" fill="#475569">주문 행 잠금 · seq 할당</text>
  <text x="52" y="217" font-size="11" fill="#475569">같은 트랜잭션의 Outbox</text>

  <!-- Kafka -->
  <rect x="254" y="110" width="170" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="270" y="136" font-size="15" font-weight="700" fill="#0f172a">Kafka</text>
  <text x="270" y="158" font-size="12" fill="#334155">partner-order-requests</text>
  <text x="270" y="178" font-size="11" fill="#475569">key = sellerId:orderId</text>
  <text x="270" y="196" font-size="11" fill="#475569">같은 주문은 같은 partition</text>
  <text x="270" y="214" font-size="11" fill="#475569">acks=all · 멱등 producer</text>
  <line x1="214" y1="170" x2="250" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="214" y="160" font-size="10" fill="#64748b">relay</text>

  <!-- Partner integration service -->
  <rect x="464" y="86" width="300" height="370" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="480" y="112" font-size="15" font-weight="700" fill="#1e3a8a">Partner Integration Service</text>

  <rect x="480" y="126" width="268" height="54" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="492" y="148" font-size="12" font-weight="600" fill="#0f172a">① Listener</text>
  <text x="492" y="167" font-size="11" fill="#475569">inbox 저장 commit 뒤 offset commit (인계 완료)</text>

  <rect x="480" y="196" width="268" height="62" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="492" y="218" font-size="12" font-weight="600" fill="#0f172a">② Inbox · MySQL partner_db</text>
  <text x="492" y="236" font-size="11" fill="#475569">event_id PK로 재전달 흡수</text>
  <text x="492" y="252" font-size="11" fill="#475569">미처리 200건 초과 시 수신 중단(backpressure)</text>

  <rect x="480" y="274" width="268" height="78" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="492" y="296" font-size="12" font-weight="600" fill="#1d4ed8">③ Admission policy</text>
  <text x="492" y="314" font-size="11" fill="#334155">워커 4 · 판매처당 동시 2 · 주문당 1</text>
  <text x="492" y="330" font-size="11" fill="#334155">판매처당 재시도 1초에 2회</text>
  <text x="492" y="346" font-size="11" fill="#334155">재시도 대기는 시각으로 저장(스레드 점유 X)</text>

  <rect x="480" y="368" width="268" height="72" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="492" y="390" font-size="12" font-weight="600" fill="#0f172a">④ Worker → 판매처 API</text>
  <text x="492" y="408" font-size="11" fill="#475569">이전 seq 전달 전에는 호출하지 않음</text>
  <text x="492" y="424" font-size="11" fill="#475569">성공 시 전달 원장 + inbox DONE 한 트랜잭션</text>

  <line x1="424" y1="170" x2="476" y2="153" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="614" y1="180" x2="614" y2="192" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="614" y1="258" x2="614" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="614" y1="352" x2="614" y2="364" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Seller APIs -->
  <rect x="804" y="250" width="172" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="820" y="276" font-size="15" font-weight="700" fill="#0f172a">판매처 API</text>
  <text x="820" y="296" font-size="11" fill="#475569">Idempotency-Key = eventId</text>
  <rect x="820" y="310" width="140" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="832" y="332" font-size="12" fill="#0f172a">정상 판매처 19곳</text>
  <rect x="820" y="354" width="140" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="832" y="375" font-size="12" font-weight="600" fill="#b91c1c">느린 판매처</text>
  <text x="832" y="392" font-size="11" fill="#b91c1c">주문 20% · 600ms~3s</text>
  <text x="820" y="424" font-size="10" fill="#64748b">별도 프로세스 · SQLite 원장</text>
  <line x1="748" y1="404" x2="800" y2="404" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowAccent)"/>

  <!-- Verification -->
  <rect x="24" y="300" width="400" height="140" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="40" y="326" font-size="15" font-weight="700" fill="#0f172a">검증 장치 (서비스 밖 프로세스)</text>
  <text x="40" y="350" font-size="12" fill="#334155">· 수집기: 250ms 관측, 장애 30초 전 기록 보존</text>
  <text x="40" y="372" font-size="12" fill="#334155">· checker: 판매처 원장 ↔ DB 대조</text>
  <text x="56" y="390" font-size="11" fill="#475569">누락 · 중복 · 순서 위반 · payload 불일치</text>
  <text x="40" y="412" font-size="12" fill="#334155">· 실패 경계 hook: commit 직후·ack 직전 강제 종료</text>
  <text x="40" y="430" font-size="11" fill="#475569">앱의 성공 카운터는 믿지 않는다</text>

  <!-- Legend -->
  <text x="24" y="488" font-size="12" font-weight="700" fill="#0f172a">설계 원칙</text>
  <text x="24" y="510" font-size="12" fill="#334155">(1) offset 진행을 외부 호출 완료와 분리한다 — ① ②</text>
  <text x="24" y="530" font-size="12" fill="#334155">(2) 한 판매처가 쓸 수 있는 실행 슬롯에 상한을 둔다 — ③</text>
</svg>
