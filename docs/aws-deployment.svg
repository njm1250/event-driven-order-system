<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">AWS 실험 구성: 구성요소마다 전용 호스트</text>
  <text x="24" y="60" font-size="13" fill="#475569">서울 ap-northeast-2a · 모든 호스트 m7i.large(2 vCPU, Flex 아님) · 부하 발생기와 측정 대상을 분리 · 실행 후 전부 삭제</text>

  <rect x="24" y="80" width="740" height="420" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="104" font-size="13" font-weight="700" fill="#9a3412">default VPC · 실험 전용 Security Group (내부 통신만, SSH는 내 IP)</text>

  <!-- controller -->
  <rect x="40" y="122" width="220" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="56" y="146" font-size="14" font-weight="700" fill="#0f172a">제어기 호스트</text>
  <text x="56" y="168" font-size="11" fill="#475569">부하 주입(목표 eps 고정)</text>
  <text x="56" y="185" font-size="11" fill="#475569">독립 수집기 · checker</text>
  <text x="56" y="202" font-size="11" fill="#475569">호스트 CPU·디스크, MySQL 통계 수집</text>
  <text x="56" y="219" font-size="11" fill="#475569">partner JVM 원격 기동·종료</text>

  <!-- partner -->
  <rect x="300" y="122" width="210" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="316" y="146" font-size="14" font-weight="700" fill="#1e3a8a">partner 서비스 호스트</text>
  <text x="316" y="168" font-size="11" fill="#475569">비교 대상 JVM 1개 (구조 6종 중 1)</text>
  <text x="316" y="185" font-size="11" fill="#475569">Xmx 192 MiB · 워커 4 · DB 커넥션 4</text>
  <text x="316" y="202" font-size="11" fill="#475569">로그는 호스트 로컬 파일</text>
  <text x="316" y="219" font-size="11" fill="#475569">JFR 프로파일링 대상</text>
  <line x1="260" y1="178" x2="296" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- mock -->
  <rect x="550" y="122" width="198" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="566" y="146" font-size="14" font-weight="700" fill="#0f172a">판매처 API 호스트</text>
  <text x="566" y="168" font-size="11" fill="#475569">판매처 20곳 모의 API :8099</text>
  <text x="566" y="185" font-size="11" fill="#475569">지연 · hang · 오류 · 응답 유실</text>
  <text x="566" y="202" font-size="11" fill="#475569">멱등 키 · 실행별 SQLite 원장</text>
  <line x1="510" y1="178" x2="546" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- mysql -->
  <rect x="300" y="268" width="210" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="316" y="292" font-size="14" font-weight="700" fill="#0f172a">MySQL 8.4 호스트</text>
  <text x="316" y="314" font-size="11" fill="#475569">gp3 EBS (로컬 실험은 tmpfs)</text>
  <text x="316" y="331" font-size="11" fill="#475569">inbox · 전달 원장</text>
    <line x1="405" y1="234" x2="405" y2="264" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- kafka -->
  <rect x="40" y="268" width="220" height="216" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="292" font-size="14" font-weight="700" fill="#0f172a">Kafka 3.9.1 (KRaft)</text>
  <text x="56" y="312" font-size="11" fill="#475569">1단계: broker 1대</text>
  <text x="56" y="328" font-size="11" fill="#475569">2단계: broker 3대 · RF 3</text>
  <text x="56" y="344" font-size="11" fill="#475569">min.insync.replicas 2 · acks=all</text>
  <rect x="56" y="358" width="60" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="380" font-size="11" fill="#0f172a">kafka-1</text>
  <rect x="124" y="358" width="60" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="136" y="380" font-size="11" fill="#0f172a">kafka-2</text>
  <rect x="192" y="358" width="56" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="200" y="380" font-size="11" fill="#0f172a">kafka-3</text>
  <text x="56" y="414" font-size="11" fill="#475569">점선: 2단계에만 추가</text>
  <text x="56" y="432" font-size="11" fill="#b91c1c">2단계 장애: kafka-2 강제 종료,</text>
  <text x="56" y="448" font-size="11" fill="#b91c1c">10초 뒤 재시작</text>
  <line x1="300" y1="200" x2="264" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- what was measured -->
  <rect x="300" y="396" width="448" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="316" y="420" font-size="13" font-weight="700" fill="#0f172a">실행마다 남긴 것</text>
  <text x="316" y="442" font-size="11" fill="#475569">p50·p95·p99, 처리량, lag · 호스트별 CPU·steal·디스크 쓰기 지연</text>
  <text x="316" y="459" font-size="11" fill="#475569">MySQL commit/INSERT/UPDATE 지연·redo fsync · JVM GC · Kafka 발행 지연</text>
  <text x="316" y="476" font-size="11" fill="#475569">판매처 원장 ↔ DB 대조(누락·중복·순서) · commit · JAR 해시</text>

  <!-- laptop and safety -->
  <rect x="790" y="80" width="186" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="806" y="106" font-size="14" font-weight="700" fill="#0f172a">로컬 노트북</text>
  <text x="806" y="128" font-size="11" fill="#475569">cluster.sh up/run/fetch/down</text>
  <text x="806" y="146" font-size="11" fill="#475569">commit 번들 · JAR 전송</text>
  <text x="806" y="164" font-size="11" fill="#475569">실험은 제어기에서 분리 실행</text>
  <text x="806" y="182" font-size="11" fill="#475569">(노트북이 잠들어도 계속)</text>
  <text x="806" y="200" font-size="11" fill="#475569">결과 회수 · SHA-256 기록</text>
  <text x="806" y="218" font-size="11" fill="#475569">자원 원장 기준으로만 삭제</text>
  <line x1="788" y1="160" x2="768" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="790" y="252" width="186" height="148" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="806" y="278" font-size="14" font-weight="700" fill="#14532d">종료 장치 3겹</text>
  <text x="806" y="300" font-size="11" fill="#166534">① OS 타이머 → 종료 시</text>
  <text x="822" y="316" font-size="11" fill="#166534">terminate</text>
  <text x="806" y="338" font-size="11" fill="#166534">② EventBridge Scheduler</text>
  <text x="822" y="354" font-size="11" fill="#166534">기한에 TerminateInstances</text>
  <text x="806" y="376" font-size="11" fill="#166534">③ teardown.sh: 인스턴스·SG</text>
  <text x="822" y="392" font-size="11" fill="#166534">·키·예약·역할 삭제 확인</text>

  <text x="24" y="532" font-size="12" font-weight="700" fill="#0f172a">쓰지 않은 것과 그 이유</text>
  <text x="24" y="554" font-size="12" fill="#334155">MSK·RDS 대신 EC2에 직접 설치: broker 강제 종료 같은 장애 주입을 직접 제어하기 위해. Flex 인스턴스 제외: CPU 공급이 일정하지 않아 포화 실험에 부적합.</text>
  <text x="24" y="576" font-size="12" fill="#334155">partner 서비스는 1대(inbox 작업 lease 미구현). 같은 하드웨어에서 구조별 차이와 병목 위치를 보는 구성이다.</text>
</svg>
