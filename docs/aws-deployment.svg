<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">AWS 대표 비교 실행 구성</text>
  <text x="24" y="60" font-size="13" fill="#475569">서울 리전 · 같은 AZ의 EC2 2대 · 판매처 API는 VPC 네트워크를 건너 호출 · 실행 뒤 모든 자원 삭제</text>

  <rect x="24" y="84" width="760" height="330" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="108" font-size="13" font-weight="700" fill="#9a3412">ap-northeast-2a · default VPC · 실험 전용 Security Group</text>

  <!-- System host -->
  <rect x="40" y="124" width="430" height="274" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="150" font-size="15" font-weight="700" fill="#0f172a">시스템 호스트 · m6i.xlarge</text>
  <text x="56" y="170" font-size="11" fill="#64748b">4 vCPU · 16 GiB · gp3 30 GiB</text>
  <rect x="56" y="184" width="190" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="206" font-size="12" font-weight="600" fill="#0f172a">Docker: Kafka 3.9.1</text>
  <text x="68" y="224" font-size="11" fill="#475569">KRaft 단일 broker</text>
  <text x="68" y="239" font-size="11" fill="#475569">CPU 2 · 메모리 1 GiB 제한</text>
  <rect x="262" y="184" width="190" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="274" y="206" font-size="12" font-weight="600" fill="#0f172a">Docker: MySQL 8.4</text>
  <text x="274" y="224" font-size="11" fill="#475569">partner_db (inbox · 원장)</text>
  <text x="274" y="239" font-size="11" fill="#475569">CPU 2 · 메모리 1 GiB 제한</text>
  <rect x="56" y="258" width="396" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="280" font-size="12" font-weight="600" fill="#1e3a8a">Partner Integration Service (JVM)</text>
  <text x="68" y="298" font-size="11" fill="#475569">Xmx 192 MiB · 워커 4 · DB 커넥션 4 · 모드별 같은 예산</text>
  <rect x="56" y="326" width="396" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="68" y="348" font-size="12" font-weight="600" fill="#0f172a">실험 제어기 · 독립 수집기 · checker</text>
  <text x="68" y="366" font-size="11" fill="#475569">입력 주입 · 장애 제어 · 원장 ↔ DB 대조</text>

  <!-- Partner host -->
  <rect x="540" y="200" width="228" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="556" y="226" font-size="15" font-weight="700" fill="#0f172a">판매처 API 호스트</text>
  <text x="556" y="246" font-size="11" fill="#64748b">m6i.large · 2 vCPU · 8 GiB</text>
  <rect x="556" y="260" width="196" height="64" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="568" y="282" font-size="12" font-weight="600" fill="#0f172a">모의 판매처 API :8099</text>
  <text x="568" y="300" font-size="11" fill="#475569">판매처별 지연 · 오류 · 응답 유실</text>
  <text x="568" y="316" font-size="11" fill="#475569">멱등 키 · 실행별 SQLite 원장</text>
  <line x1="452" y1="286" x2="536" y2="286" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="462" y="278" font-size="10" fill="#64748b">private IP</text>
  <line x1="536" y1="306" x2="456" y2="350" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="490" y="356" font-size="10" fill="#64748b">원장 조회</text>

  <!-- Laptop and safety -->
  <rect x="808" y="84" width="168" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="824" y="110" font-size="14" font-weight="700" fill="#0f172a">로컬 노트북</text>
  <text x="824" y="132" font-size="11" fill="#475569">git bundle · JAR 전송</text>
  <text x="824" y="150" font-size="11" fill="#475569">SSH: 내 IP만 허용</text>
  <text x="824" y="168" font-size="11" fill="#475569">결과 회수 · checksum</text>
  <text x="824" y="186" font-size="11" fill="#475569">세션 manifest 기록</text>
  <line x1="806" y1="160" x2="788" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="808" y="250" width="168" height="164" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="824" y="276" font-size="14" font-weight="700" fill="#14532d">종료 장치 3겹</text>
  <text x="824" y="298" font-size="11" fill="#166534">① OS 타이머 → 종료 시</text>
  <text x="840" y="314" font-size="11" fill="#166534">terminate</text>
  <text x="824" y="336" font-size="11" fill="#166534">② EventBridge Scheduler</text>
  <text x="840" y="352" font-size="11" fill="#166534">기한에 TerminateInstances</text>
  <text x="824" y="374" font-size="11" fill="#166534">③ 스크립트 trap: 인스턴스</text>
  <text x="840" y="390" font-size="11" fill="#166534">· SG · 키 · 역할 삭제</text>

  <text x="24" y="448" font-size="12" font-weight="700" fill="#0f172a">쓰지 않은 것</text>
  <text x="24" y="470" font-size="12" fill="#334155">MSK · RDS · NAT Gateway · ALB · EKS · 장기 S3 보관. 단일 broker · 단일 MySQL이라 HA나 AZ 장애 대응을 주장하지 않는다.</text>
  <text x="24" y="492" font-size="12" fill="#334155">반복 실행과 실패 경계 검증은 로컬에서 끝내고, AWS에서는 대표 비교를 별도 네트워크 홉에서 재현하는 데만 쓴다.</text>
</svg>
